name: Build libcpr Static MT for Windows

on:
  push:
    branches: [ 1.9.x ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX=../install ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DCPR_USE_SYSTEM_CURL=OFF ^
          -DCPR_ENABLE_SSL=ON ^
          -DCPR_BUILD_TESTS=OFF ^
          -DCPR_BUILD_EXAMPLES=OFF ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
          -DCMAKE_CXX_FLAGS_RELEASE="/MT /DCURL_STATICLIB" ^
          -DCMAKE_C_FLAGS_RELEASE="/MT" ^
          -DCURL_USE_SCHANNEL=ON ^
          -DCURL_USE_OPENSSL=OFF ^
          -DCURL_ZLIB=OFF ^
          -DUSE_NGHTTP2=OFF ^
          -DCURL_BROTLI=OFF ^
          -DCURL_ZSTD=OFF ^
          -DCURL_USE_LIBPSL=OFF ^
          -DBUILD_CURL_EXE=OFF ^
          -DBUILD_TESTING=OFF

    - name: Build Release
      run: |
        cd build
        cmake --build . --config Release --parallel

    - name: Install and copy bundled curl lib
      run: |
        cd build
        cmake --install . --config Release
        mkdir -p ../install/lib
        copy Release\libcurl.lib ../install/lib/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cpr-static-mt-artifacts
        path: |
          install/include/
          install/lib/
        retention-days: 30
