name: Windows Static LIB Build (CPR 1.9.x)

on:
  push:
    branches:
      - '1.9.x'
  pull_request:
    branches:
      - '1.9.x'
  workflow_dispatch:

jobs:
  build_cpr_static_lib:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: '1.9.x'
          submodules: recursive

      - name: Configure CMake for Static LIB (Release)
        shell: powershell
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED-libs=OFF `
            -DCPR_ENABLE_SSL=ON `
            -DCPR_BUILD_TESTS=OFF `
            -DCPR_BUILD_TESTS_SSL=OFF `
            -DCPR_BUILD_TESTS_PROXY=OFF `
            -DCPR_FORCE_USE_SYSTEM_CURL=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded"

      - name: Build cpr Library Only
        shell: powershell
        run: |
          cmake --build build --config Release --target cpr

      - name: List Build Directory Contents
        shell: powershell
        run: |
          Write-Host "=== Contents of build/ directory ==="
          Get-ChildItem -Path build -Recurse -File | 
            Where-Object { $_.Extension -eq '.lib' } | 
            Format-Table Name, Directory
          
          Write-Host "=== Contents of build/Release/ directory ==="
          if (Test-Path build/Release) {
            Get-ChildItem -Path build/Release -Recurse -File | 
              Where-Object { $_.Extension -eq '.lib' } | 
              Format-Table Name, Directory
          } else {
            Write-Host "build/Release directory does not exist."
          }
              
          Write-Host "=== Contents of cpr/build/ directory ==="
          Get-ChildItem -Path cpr/build -Recurse -File | 
            Where-Object { $_.Extension -eq '.lib' } | 
            Format-Table Name, Directory
          
          Write-Host "=== Contents of cpr/build/Release/ directory ==="
          if (Test-Path cpr/build/Release) {
            Get-ChildItem -Path cpr/build/Release -Recurse -File | 
              Where-Object { $_.Extension -eq '.lib' } | 
              Format-Table Name, Directory
          } else {
            Write-Host "cpr/build/Release directory does not exist."
          }
          
      - name: Upload Static Library Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpr-static-lib-windows-1.9.x
          path: |
            build/lib/Release/*.lib
          if-no-files-found: error
