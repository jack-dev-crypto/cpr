name: Build libcpr 1.9.x Static MT (C++11)

on:
  push:
    branches: [ 1.9.x ]
  pull_request:
    branches: [ 1.9.x ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
    - name: Checkout 1.9.x with submodules
      uses: actions/checkout@v4
      with:
        ref: 1.9.x
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake (C++11 + /MT + Static)
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_INSTALL_PREFIX=../install ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DCPR_USE_SYSTEM_CURL=OFF ^
          -DCPR_ENABLE_SSL=ON ^
          -DCPR_BUILD_TESTS=OFF ^
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
          -DCMAKE_CXX_FLAGS_RELEASE="/MT /DCURL_STATICLIB /std:c++11" ^
          -DCMAKE_C_FLAGS_RELEASE="/MT" ^
          -DCURL_USE_SCHANNEL=ON ^
          -DCURL_ZLIB=OFF ^
          -DUSE_NGHTTP2=OFF ^
          -DCURL_BROTLI=OFF ^
          -DCURL_ZSTD=OFF ^
          -DCURL_USE_LIBPSL=OFF ^
          -DBUILD_CURL_EXE=OFF

    - name: Build Release
      run: |
        cd build
        cmake --build . --config Release --parallel

    - name: Install & Bundle curl lib
      run: |
        cd build
        cmake --install . --config Release
        mkdir -p ../install/lib
        copy Release\libcurl.lib ../install/lib\

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cpr-1.9.x-static-mt-win64
        path: |
          install/include/
          install/lib/
        retention-days: 30
